<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>二胡调音器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #050510;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
            padding-bottom: calc(30px + env(safe-area-inset-bottom));
            overflow-x: hidden;
        }

        /* ===== 标题区 ===== */
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        .header h1 {
            font-size: 30px;
            color: #ffd700;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        .status-bar {
            margin-top: 8px;
            font-size: 14px;
            color: #888;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            display: inline-block;
        }
        .status-dot.active {
            background: #00e676;
            box-shadow: 0 0 8px #00e676;
        }

        /* ===== 表盘区（上半部分） ===== */
        .meter-wrapper {
            position: relative;
            width: 340px;
            height: 200px;
            margin-top: 15px;
            margin-bottom: 0;
        }
        canvas#meterCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 340px;
            height: 180px;
            z-index: 1;
        }

        /* ===== 数字显示区（表盘正下方，完全独立） ===== */
        .hz-box {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 2;
            pointer-events: none;
        }
        .hz-value {
            font-size: 44px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 12px rgba(0, 212, 255, 0.5);
        }
        .hz-unit {
            font-size: 20px;
            color: #00d4ff;
            margin-left: 4px;
        }

        /* ===== 提示文字 ===== */
        .action-text {
            margin-top: 12px;
            font-size: 20px;
            color: #ccc;
            background: rgba(255,255,255,0.05);
            padding: 8px 22px;
            border-radius: 10px;
            min-width: 160px;
            text-align: center;
        }
        .action-text.good { color: #00e676; background: rgba(0,230,118,0.1); }
        .action-text.flat { color: #00aaff; background: rgba(0,170,255,0.1); }
        .action-text.sharp { color: #ff5252; background: rgba(255,82,82,0.1); }

        /* ===== 按钮区 ===== */
        .btn {
            width: 100%;
            max-width: 340px;
            padding: 16px 20px;
            border: none;
            border-radius: 14px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.1s;
            -webkit-touch-callout: none;
            user-select: none;
        }
        .btn:active { transform: scale(0.97); }

        .btn-start {
            margin-top: 18px;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            box-shadow: 0 4px 20px rgba(255,126,95,0.4);
        }
        .btn-stop {
            background: linear-gradient(135deg, #666, #333);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-row {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 340px;
            margin-top: 12px;
        }
        .btn-listen {
            flex: 1;
            padding: 14px 10px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #5c5ca8, #3a3a80);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-listen:active { transform: scale(0.97); }

        /* ===== 底部说明 ===== */
        .tips {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            color: #666;
            line-height: 1.8;
        }

        /* ===== 微信遮罩 ===== */
        #wxMask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
        }
        #wxMask .arrow {
            position: absolute;
            top: 25px;
            right: 30px;
            font-size: 60px;
            color: #ffd700;
        }
        #wxMask p {
            font-size: 24px;
            line-height: 1.8;
            color: #fff;
        }
        #wxMask .highlight {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- 微信遮罩 -->
<div id="wxMask">
    <div class="arrow">↗</div>
    <p>
        请点右上角 <span class="highlight">···</span><br><br>
        iPhone 选 <span class="highlight">「在 Safari 中打开」</span><br><br>
        安卓选 <span class="highlight">「在浏览器打开」</span><br><br>
        然后才能用麦克风调音！
    </p>
</div>

<!-- 标题 -->
<div class="header">
    <h1>🎻 二胡调音器</h1>
    <div class="status-bar">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">未启动</span>
    </div>
</div>

<!-- 表盘（上）+ 数字（下），完全分离 -->
<div class="meter-wrapper">
    <canvas id="meterCanvas"></canvas>
    <div class="hz-box">
        <span class="hz-value" id="hzValue">0.0</span>
        <span class="hz-unit">Hz</span>
    </div>
</div>

<!-- 状态文字 -->
<div class="action-text" id="actionText">等待拉琴...</div>

<!-- 开始/停止按钮 -->
<button class="btn btn-start" id="toggleBtn">
    <span>🎤</span> 开始调音
</button>

<!-- 听音按钮 -->
<div class="btn-row">
    <button class="btn-listen" id="playInnerBtn">🔊 听内弦 D</button>
    <button class="btn-listen" id="playOuterBtn">🔊 听外弦 A</button>
</div>

<!-- 底部说明 -->
<div class="tips">
    拉琴时琴码靠近手机底部麦克风<br>
    内弦标准 D ≈ 293.7Hz · 外弦标准 A ≈ 440Hz
</div>

<script>
// ===== DOM =====
const canvas = document.getElementById('meterCanvas');
const ctx = canvas.getContext('2d');
const hzValueEl = document.getElementById('hzValue');
const actionTextEl = document.getElementById('actionText');
const toggleBtn = document.getElementById('toggleBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const playInnerBtn = document.getElementById('playInnerBtn');
const playOuterBtn = document.getElementById('playOuterBtn');
const wxMask = document.getElementById('wxMask');

// ===== 常量 =====
const INNER_FREQ = 293.7;
const OUTER_FREQ = 440.0;
const MAX_CENTS = 50;

// ===== 状态 =====
let audioCtx, analyser, microphone, dataArray;
let isListening = false;
let animId;

// ===== 微信检测 =====
if (/MicroMessenger/i.test(navigator.userAgent)) {
    wxMask.style.display = 'flex';
}

// ===== Canvas 初始化 =====
function initCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = 340 * dpr;
    canvas.height = 180 * dpr;
    ctx.scale(dpr, dpr);
}
initCanvas();

// ===== 绘制半圆表盘 =====
function drawMeter(cents) {
    const W = 340, H = 180;
    ctx.clearRect(0, 0, W, H);

    const cx = W / 2;
    const cy = H - 10;       // 圆心在底部
    const R = 150;           // 大半径

    // 1. 彩色弧带（红-黄-绿-黄-红）
    const grad = ctx.createLinearGradient(cx - R, 0, cx + R, 0);
    grad.addColorStop(0,    "#ff4757");
    grad.addColorStop(0.25, "#ffa502");
    grad.addColorStop(0.5,  "#2ed573");
    grad.addColorStop(0.75, "#ffa502");
    grad.addColorStop(1,    "#ff4757");

    ctx.beginPath();
    ctx.arc(cx, cy, R, Math.PI, 0, false);
    ctx.lineWidth = 22;
    ctx.strokeStyle = grad;
    ctx.stroke();

    // 2. 背景弧（半透明底色）
    ctx.beginPath();
    ctx.arc(cx, cy, R - 26, Math.PI, 0, false);
    ctx.lineWidth = 4;
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    ctx.stroke();

    // 3. 刻度线 + 数字
    const tickCount = 20; // -50¢ ~ +50¢
    for (let i = 0; i <= tickCount; i++) {
        const angle = Math.PI + (i / tickCount) * Math.PI;
        const isMajor = i % 5 === 0;
        const r1 = isMajor ? R - 32 : R - 26;
        const r2 = R - 8;
        const x1 = cx + Math.cos(angle) * r1;
        const y1 = cy + Math.sin(angle) * r1;
        const x2 = cx + Math.cos(angle) * r2;
        const y2 = cy + Math.sin(angle) * r2;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = isMajor ? 3 : 1.5;
        ctx.strokeStyle = isMajor ? "#fff" : "rgba(255,255,255,0.4)";
        ctx.stroke();

        if (isMajor) {
            const tr = R - 46;
            const tx = cx + Math.cos(angle) * tr;
            const ty = cy + Math.sin(angle) * tr;
            ctx.font = "12px sans-serif";
            ctx.fillStyle = "#aaa";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const val = Math.round((i / tickCount) * 100 - 50);
            ctx.fillText(val, tx, ty);
        }
    }

    // 4. 中心绿点（0位基准）
    ctx.beginPath();
    ctx.arc(cx, cy, 6, 0, Math.PI * 2);
    ctx.fillStyle = "#2ed573";
    ctx.fill();

    // 5. 指针
    const clamped = Math.max(-MAX_CENTS, Math.min(MAX_CENTS, cents));
    const angle = Math.PI + ((clamped + MAX_CENTS) / (MAX_CENTS * 2)) * Math.PI;
    const plen = R - 36;
    const px = cx + Math.cos(angle) * plen;
    const py = cy + Math.sin(angle) * plen;

    // 指针线
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(px, py);
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#fff";
    ctx.lineCap = "round";
    ctx.stroke();

    // 指针头
    ctx.beginPath();
    ctx.arc(px, py, 7, 0, Math.PI * 2);
    ctx.fillStyle = "#ff4757";
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.stroke();
}

// ===== 初始绘制 =====
drawMeter(0);

// ===== 音频：开始 =====
async function startListen() {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") await audioCtx.resume();

        const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        microphone = audioCtx.createMediaStreamSource(stream);
        microphone.connect(analyser);
        dataArray = new Float32Array(analyser.fftSize);

        isListening = true;
        toggleBtn.className = "btn btn-stop";
        toggleBtn.innerHTML = "<span>🛑</span> 停止调音";
        statusDot.classList.add("active");
        statusText.textContent = "监听中";
        actionTextEl.textContent = "请拉琴...";
        actionTextEl.className = "action-text";

        detect();
    } catch (e) {
        alert("无法访问麦克风！请确认：\n1. 用的是系统浏览器（非微信内）\n2. 已允许麦克风权限");
        console.error(e);
    }
}

// ===== 音频：停止 =====
function stopListen() {
    isListening = false;
    toggleBtn.className = "btn btn-start";
    toggleBtn.innerHTML = "<span>🎤</span> 开始调音";
    statusDot.classList.remove("active");
    statusText.textContent = "未启动";
    actionTextEl.textContent = "等待拉琴...";
    actionTextEl.className = "action-text";
    hzValueEl.textContent = "0.0";

    if (microphone) microphone.disconnect();
    if (animId) cancelAnimationFrame(animId);
    drawMeter(0);
}

// ===== 音高检测（自相关） =====
function detect() {
    if (!isListening) return;
    analyser.getFloatTimeDomainData(dataArray);

    // RMS 音量检测
    let rms = 0;
    for (let i = 0; i < dataArray.length; i++) rms += dataArray[i] * dataArray[i];
    rms = Math.sqrt(rms / dataArray.length);

    if (rms > 0.008) {
        // 找过零点
        let r1 = 0, r2 = dataArray.length - 1;
        for (let i = 0; i < dataArray.length / 2; i++) {
            if (Math.abs(dataArray[i]) < 0.02) { r1 = i; break; }
        }
        for (let i = 1; i < dataArray.length / 2; i++) {
            if (Math.abs(dataArray[dataArray.length - i]) < 0.02) { r2 = dataArray.length - i; break; }
        }
        const buf = dataArray.slice(r1, r2);
        const N = buf.length;
        if (N > 64) {
            const c = new Float32Array(N);
            for (let i = 0; i < N; i++) {
                for (let j = 0; j < N - i; j++) {
                    c[i] += buf[j] * buf[j + i];
                }
            }
            let d = 0;
            while (d < N - 1 && c[d] > c[d + 1]) d++;
            let maxV = -1, maxP = -1;
            for (let i = d; i < N; i++) {
                if (c[i] > maxV) { maxV = c[i]; maxP = i; }
            }
            if (maxP > 0) {
                const freq = audioCtx.sampleRate / maxP;
                if (freq > 250 && freq < 550) {
                    updateUI(freq);
                }
            }
        }
    }
    animId = requestAnimationFrame(detect);
}

// ===== 更新界面 =====
function updateUI(freq) {
    hzValueEl.textContent = freq.toFixed(1);

    // 判断靠近哪根弦
    const diffD = freq - INNER_FREQ;
    const diffA = freq - OUTER_FREQ;
    let target, cents;
    if (Math.abs(diffD) < Math.abs(diffA)) {
        target = INNER_FREQ;
        cents = 1200 * Math.log2(freq / INNER_FREQ);
        actionTextEl.textContent = "内弦 D";
    } else {
        target = OUTER_FREQ;
        cents = 1200 * Math.log2(freq / OUTER_FREQ);
        actionTextEl.textContent = "外弦 A";
    }

    const clampedCents = Math.max(-MAX_CENTS, Math.min(MAX_CENTS, cents));
    drawMeter(clampedCents);

    // 状态颜色
    if (Math.abs(cents) < 3) {
        actionTextEl.className = "action-text good";
        actionTextEl.textContent += " ✓ 准";
    } else if (cents < 0) {
        actionTextEl.className = "action-text flat";
        actionTextEl.textContent += " 偏低";
    } else {
        actionTextEl.className = "action-text sharp";
        actionTextEl.textContent += " 偏高";
    }
}

// ===== 播放参考音 =====
function playTone(freq) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2);
    osc.start();
    osc.stop(audioCtx.currentTime + 2);
}

// ===== 事件绑定 =====
toggleBtn.addEventListener("click", () => {
    isListening ? stopListen() : startListen();
});
playInnerBtn.addEventListener("click", () => playTone(INNER_FREQ));
playOuterBtn.addEventListener("click", () => playTone(OUTER_FREQ));

// ===== 窗口变化重绘 =====
window.addEventListener("resize", () => {
    initCanvas();
    drawMeter(0);
});
</script>
</body>
</html>
