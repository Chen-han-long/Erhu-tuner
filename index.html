<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>二胡调音器</title>
    <style>
        :root {
            --bg-color: #050510;
            --text-main: #ffffff;
            --text-sub: #8888aa;
            --btn-start: #ff6b35;
            --btn-listen: #4a4a9c;
            --accent-blue: #00d4ff;
            --accent-green: #00e676;
            --accent-red: #ff5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            /* iOS 底部安全区适配 */
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0px;
        }

        .header h1 {
            font-size: 28px;
            color: #ffd700;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .emoji {
            font-size: 32px;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #555;
            transition: background-color 0.3s;
        }

        .status-dot.active {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* 表盘容器 - 增大高度，让表盘靠上 */
        .meter-container {
            position: relative;
            width: 300px;
            height: 170px; /* 增加高度，容纳更大的表盘 */
            margin: 5px 0 0 0; /* 减少上边距 */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 赫兹数显示 - 大幅下移，远离表盘 */
        .hz-display {
            position: absolute;
            bottom: 5px; /* 放置在容器底部 */
            left: 50%;
            transform: translateX(-50%);
            font-size: 46px;
            font-weight: bold;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            background: rgba(0,0,0,0.5);
            padding: 2px 20px;
            border-radius: 12px;
            z-index: 10;
            white-space: nowrap;
            letter-spacing: 1px;
        }
        
        .hz-label {
            font-size: 20px;
            color: var(--accent-blue);
            margin-left: 4px;
        }

        /* 文字提示 */
        .status-text {
            font-size: 20px;
            color: var(--text-sub);
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 25px;
            border-radius: 8px;
            margin-top: 5px;
            min-width: 150px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .status-text.ready {
            color: var(--accent-green);
            background: rgba(0, 230, 118, 0.1);
        }

        /* 按钮通用样式 */
        .btn {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .btn-start {
            background: linear-gradient(135deg, #ff8a50, #ff4d00);
            box-shadow: 0 4px 20px rgba(255, 107, 53, 0.4);
            margin-top: 5px;
        }

        .btn-stop {
            background: linear-gradient(135deg, #666, #333);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            width: 100%;
            margin-top: 5px;
        }

        .btn-listen {
            flex: 1;
            background: linear-gradient(135deg, #5c5ca8, #3a3a80);
            box-shadow: 0 4px 10px rgba(74, 74, 156, 0.3);
            font-size: 16px;
            padding: 14px 10px;
        }

        .info-text {
            font-size: 12px;
            color: var(--text-sub);
            text-align: center;
            line-height: 1.6;
            margin-top: 8px;
            opacity: 0.8;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="emoji">🎻</span>
        <h1>二胡调音器</h1>
    </div>

    <div class="status-container">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">未启动</span>
    </div>

    <!-- 表盘区域 -->
    <div class="meter-container">
        <canvas id="meterCanvas" width="600" height="340"></canvas>
        <div class="hz-display">
            <span id="hzValue">0.0</span>
            <span class="hz-label">Hz</span>
        </div>
    </div>

    <div class="status-text" id="actionText">等待拉琴</div>

    <!-- 开始/停止按钮 -->
    <button class="btn btn-start" id="toggleBtn">
        <span>🎤</span> 开始调音
    </button>

    <!-- 听音按钮组 -->
    <div class="btn-group">
        <button class="btn btn-listen" id="playInnerBtn">
            🔊 听内弦 D
        </button>
        <button class="btn btn-listen" id="playOuterBtn">
            🔊 听外弦 A
        </button>
    </div>

    <div class="info-text">
        拉琴时琴码靠近手机底部麦克风<br>
        内弦标准 D ≈ 293.7Hz · 外弦标准 A ≈ 440Hz
    </div>
</div>

<script>
    // DOM 元素
    const canvas = document.getElementById('meterCanvas');
    const ctx = canvas.getContext('2d');
    const hzValueEl = document.getElementById('hzValue');
    const actionTextEl = document.getElementById('actionText');
    const toggleBtn = document.getElementById('toggleBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const playInnerBtn = document.getElementById('playInnerBtn');
    const playOuterBtn = document.getElementById('playOuterBtn');

    // 音频上下文
    let audioContext;
    let analyser;
    let microphone;
    let dataArray;
    let isListening = false;
    let animationId;

    // 常量
    const INNER_FREQ = 293.7;
    const OUTER_FREQ = 440.0;
    const MAX_DEVIATION = 504; // 表盘最大刻度
    const CANVAS_WIDTH = 600;
    const CANVAS_HEIGHT = 324;
    const CENTER_X = CANVAS_WIDTH / 2;
    const CENTER_Y = CANVAS_HEIGHT; // 半圆圆心在底部
    const RADIUS = 155; // 增大表盘半径

    // 初始化 Canvas 尺寸 (高清屏适配)
    function resizeCanvas() {
        const containerWidth = canvas.parentElement.clientWidth;
        canvas.style.width = containerWidth + "px";
        canvas.style.height = (containerWidth * (CANVAS_HEIGHT / CANVAS_WIDTH)) + "px";
        // 实际绘制分辨率放大，保证清晰度
        canvas.width = containerWidth * 2;
        canvas.height = (containerWidth * (CANVAS_HEIGHT / CANVAS_WIDTH)) * 2;
        drawMeter(0); // 重绘初始状态
    }
    
    window.addEventListener('resize', resizeCanvas);

    // 绘制半圆表盘
    function drawMeter(deviation) {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h; // 半圆圆心在底部中心
        const r = RADIUS * (w / CANVAS_WIDTH); // 自适应半径
        
        ctx.clearRect(0, 0, w, h);

        // 1. 绘制背景弧线
        ctx.beginPath();
        ctx.arc(cx, cy, r, Math.PI, 0, false); // 上半圆
        ctx.lineWidth = 24 * (w / CANVAS_WIDTH);
        ctx.strokeStyle = '#1a1a3e';
        ctx.stroke();

        // 2. 绘制刻度
        const startAngle = Math.PI;
        const endAngle = 0;
        const totalAngle = Math.PI;
        const tickCount = 21; // 21个刻度 (-504 到 504)

        for (let i = 0; i <= tickCount; i++) {
            const angle = startAngle + (i / tickCount) * totalAngle;
            const isMajor = i % 5 === 0; // 每5格一个大刻度
            
            const innerR = isMajor ? r - 35 * (w / CANVAS_WIDTH) : r - 25 * (w / CANVAS_WIDTH);
            const outerR = r - 8 * (w / CANVAS_WIDTH);
            
            const x1 = cx + Math.cos(angle) * innerR;
            const y1 = cy + Math.sin(angle) * innerR;
            const x2 = cx + Math.cos(angle) * outerR;
            const y2 = cy + Math.sin(angle) * outerR;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineWidth = isMajor ? 5 : 3;
            ctx.strokeStyle = isMajor ? '#ffffff' : '#555';
            ctx.stroke();

            // 绘制大刻度的数字
            if (isMajor) {
                const textR = innerR - 18 * (w / CANVAS_WIDTH);
                const tx = cx + Math.cos(angle) * textR;
                const ty = cy + Math.sin(angle) * textR;
                ctx.font = `${14 * (w / CANVAS_WIDTH)}px sans-serif`;
                ctx.fillStyle = '#aaa';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // 映射数值
                const val = Math.round((i / tickCount) * (MAX_DEVIATION * 2) - MAX_DEVIATION);
                ctx.fillText(val, tx, ty);
            }
        }

        // 3. 绘制彩色区域 (红-黄-绿-黄-红)
        const gradient = ctx.createLinearGradient(cx - r, 0, cx + r, 0);
        gradient.addColorStop(0, '#ff5252'); // 左红
        gradient.addColorStop(0.25, '#ffd700'); // 左黄
        gradient.addColorStop(0.5, '#00e676'); // 绿
        gradient.addColorStop(0.75, '#ffd700'); // 右黄
        gradient.addColorStop(1, '#ff5252'); // 右红
        
        ctx.beginPath();
        ctx.arc(cx, cy, r, Math.PI, 0, false);
        ctx.lineWidth = 24 * (w / CANVAS_WIDTH);
        ctx.strokeStyle = gradient;
        ctx.stroke();

        // 4. 绘制指针
        // 限制偏差显示范围
        const limitedDeviation = Math.max(-MAX_DEVIATION, Math.min(MAX_DEVIATION, deviation));
        const pointerAngle = startAngle + ((limitedDeviation + MAX_DEVIATION) / (MAX_DEVIATION * 2)) * totalAngle;
        
        const pointerLength = r - 30 * (w / CANVAS_WIDTH);
        const px = cx + Math.cos(pointerAngle) * pointerLength;
        const py = cy + Math.sin(pointerAngle) * pointerLength;

        // 指针底座
        ctx.beginPath();
        ctx.arc(cx, cy, 12 * (w / CANVAS_WIDTH), 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();

        // 指针线条
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(px, py);
        ctx.lineWidth = 5 * (w / CANVAS_WIDTH);
        ctx.strokeStyle = '#fff';
        ctx.lineCap = 'round';
        ctx.stroke();

        // 指针头部圆点
        ctx.beginPath();
        ctx.arc(px, py, 8 * (w / CANVAS_WIDTH), 0, Math.PI * 2);
        ctx.fillStyle = '#ff5252';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // 音频处理
    async function startListening() {
        try {
            // iOS 必须在用户交互后初始化 AudioContext
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }

            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            microphone = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 1024;
            microphone.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);

            isListening = true;
            toggleBtn.className = 'btn btn-stop';
            toggleBtn.innerHTML = '<span>🛑</span> 停止调音';
            statusDot.classList.add('active');
            statusText.innerText = '监听中';
            actionTextEl.classList.add('ready');
            
            detectPitch();
        } catch (err) {
            alert("无法访问麦克风，请检查权限设置。");
            console.error(err);
        }
    }

    function stopListening() {
        isListening = false;
        toggleBtn.className = 'btn btn-start';
        toggleBtn.innerHTML = '<span>🎤</span> 开始调音';
        statusDot.classList.remove('active');
        statusText.innerText = '未启动';
        actionTextEl.innerText = '等待拉琴';
        actionTextEl.classList.remove('ready');
        
        if (microphone) {
            microphone.disconnect();
        }
        if (animationId) {
            cancelAnimationFrame(animationId);
        }
        // 重置表盘
        hzValueEl.innerText = '0.0';
        drawMeter(0);
    }

    // 简单的音高检测逻辑 (基于 autocorrelation)
    function detectPitch() {
        if (!isListening) return;
        analyser.getByteTimeDomainData(dataArray);
        
        let bestOffset = -1;
        let bestCorrelation = 0;
        let foundGoodCorrelation = false;
        const rms = Math.sqrt(dataArray.reduce((acc, val) => acc + Math.pow(val - 128, 2), 0) / dataArray.length);

        if (rms > 10) { // 音量阈值
            let lastCorrelation = 1;
            for (let offset = 0; offset < 800; offset++) {
                let correlation = 0;
                for (let i = 0; i < 1000; i++) {
                    correlation += Math.abs((dataArray[i] - 128) * (dataArray[i + offset] - 128));
                }
                correlation /= 1000;
                if (correlation > 0.95 && correlation <= lastCorrelation) {
                    foundGoodCorrelation = true;
                    if (!foundGoodCorrelation) {
                        bestCorrelation = correlation;
                        bestOffset = offset;
                    } else {
                        if (correlation > bestCorrelation) {
                            bestCorrelation = correlation;
                            bestOffset = offset;
                        }
                        break;
                    }
                } else if (foundGoodCorrelation) {
                    break;
                }
                lastCorrelation = correlation;
            }

            if (bestOffset !== -1) {
                const sampleRate = audioContext.sampleRate;
                const freq = sampleRate / bestOffset;
                
                // 只处理二胡附近的频率范围
                if (freq > 250 && freq < 550) {
                    updateUI(freq);
                } else {
                    actionTextEl.innerText = '等待拉琴...';
                }
            }
        } else {
            actionTextEl.innerText = '等待拉琴...';
        }
        
        animationId = requestAnimationFrame(detectPitch);
    }

    // 更新 UI
    function updateUI(freq) {
        hzValueEl.innerText = freq.toFixed(1);
        
        // 计算偏差 (以 D 弦为基准参考，或者可以根据最近弦计算)
        const diffD = freq - INNER_FREQ;
        const diffA = freq - OUTER_FREQ;
        const minDiff = Math.abs(diffD) < Math.abs(diffA) ? diffD : diffA;
        
        // 映射到表盘刻度
        let deviation = minDiff * 2; // 放大系数，让指针动得明显
        deviation = Math.max(-MAX_DEVIATION, Math.min(MAX_DEVIATION, deviation));
        
        drawMeter(deviation);

        // 判断音准状态
        if (Math.abs(minDiff) < 5) {
            actionTextEl.innerText = '音准很好！';
            actionTextEl.style.color = '#00e676';
        } else if (minDiff < 0) {
            actionTextEl.innerText = '偏低 (拧松)';
            actionTextEl.style.color = '#ff5252';
        } else {
            actionTextEl.innerText = '偏高 (拧紧)';
            actionTextEl.style.color = '#ff5252';
        }
    }

    // 事件监听
    toggleBtn.addEventListener('click', () => {
        if (isListening) {
            stopListening();
        } else {
            startListening();
        }
    });

    // 播放标准音 (Web Audio API)
    function playTone(frequency) {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
        
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        
        osc.frequency.value = frequency;
        osc.type = 'sine';
        
        gain.gain.setValueAtTime(0, audioContext.currentTime);
        gain.gain.linearRampToValueAtTime(0.5, audioContext.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 2);
        
        osc.start();
        osc.stop(audioContext.currentTime + 2);
    }

    playInnerBtn.addEventListener('click', () => playTone(INNER_FREQ));
    playOuterBtn.addEventListener('click', () => playTone(OUTER_FREQ));

    // 初始化
    resizeCanvas();
    drawMeter(0);

</script>
</body>
</html>
